<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basílica de la Concepción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/activities.js"></script>
    <script src="./js/horarios.js"></script>
    <script src="./js/contact.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Kiosko | Basilica de la Purissima Concepcio i Assumpcio de Nostra Senyora" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300&family=Noto+Serif+Display:ital,wght@0,300;1,300&display=swap');
    </style>
</head>

<body onclick="resetTimer()" ontouchstart="resetTimer()">
    <div id="tapHint">Toca la pantalla</div>
    <button id="hamburgerBtn" onclick="event.stopPropagation(); showKioskMenu(); clearTimeout(menuTimer); menuTimer = setTimeout(hideKioskMenu, MENU_TIMEOUT)">&#9776;</button>
    <div id="menuContainer" onclick="hideKioskMenu()"></div>
    <div id="videoContainer">
        <img id="slideImage" class="slide-media">
        <video id="slideVideo" class="slide-media" muted playsinline preload="auto"></video>
        <div id="slideProgress"></div>
    </div>

    <div id="panel">
        <button class="backBtn shadow-md" onclick="event.stopPropagation(); goBack()"> &#8592; VOLVER</button>
        <div id="historia-container" class="view-container px-5 md:px-12 py-8 text-white"></div>
        <div id="actividadesContainer"
            class="view-container w-full h-full overflow-y-auto px-6 md:px-12 py-10 bg-black text-white">
        </div>
        <div id="horarios-container" class="view-container w-full overflow-y-auto bg-black text-white"></div>
        <div id="contact-container" class="view-container w-full overflow-y-auto bg-black text-white"></div>
    </div>

    <script>
        // --- Timer
        let inactivityTimer;
        let menuTimer;
        let menuJustClosed = false;
        let menuInteractiveTimer;
        let viewTracker = [];

        const MENU_TIMEOUT = 20000;

        function showKioskMenu() {
            const mc = document.getElementById("menuContainer");
            const wasHidden = mc && !mc.classList.contains("menu-visible");
            if (mc) mc.classList.add("menu-visible");
            const hint = document.getElementById("tapHint");
            if (hint) hint.classList.add("hidden");

            // On touch devices the tap that opens the menu is a touchstart
            // that runs resetTimer() -> showKioskMenu() synchronously. If the
            // menu became clickable (pointer-events: auto) right then,
            // mobile browsers re-evaluate what's under the still-down finger
            // against the updated layout - lighting up a nav button's
            // :active state and letting the synthesized click that follows
            // the same tap land on it, even though the user only meant to
            // reveal the menu. Desktop doesn't hit this: a mouse click is a
            // single atomic event with its target resolved before the
            // body's onclick handler (and thus showKioskMenu) runs.
            //
            // Fix: reveal the menu (opacity, via "menu-visible") right away,
            // but keep it non-interactive for a brief window via a separate
            // "menu-interactive" class (see styles.css), so the opening
            // tap's gesture resolves against a still-inert layer and only a
            // later, genuine tap can activate a button. Only the hidden ->
            // visible transition needs this - resetTimer() also calls
            // showKioskMenu() on every subsequent tap while the menu is
            // already open (body's ontouchstart bubbles up from the tapped
            // button), and re-arming the delay then would make the menu
            // briefly non-interactive right as a real tap lands on it.
            if (wasHidden) {
                mc.classList.remove("menu-interactive");
                clearTimeout(menuInteractiveTimer);
                menuInteractiveTimer = setTimeout(() => mc.classList.add("menu-interactive"), 300);
            }
        }

        function hideKioskMenu() {
            menuJustClosed = true;
            clearTimeout(menuInteractiveTimer);
            const mc = document.getElementById("menuContainer");
            if (mc) mc.classList.remove("menu-visible", "menu-interactive");
            const hint = document.getElementById("tapHint");
            if (hint) hint.classList.remove("hidden");
            setTimeout(() => { menuJustClosed = false; }, 200);
        }

        // --- Timer de inactividad ---
        function resetTimer() {
            clearTimeout(inactivityTimer);
            clearTimeout(menuTimer);

            let timeout = 60000;
            if (currentView === "history") timeout = 120000;
            if (currentView?.startsWith("history-detail")) timeout = 300000;

            inactivityTimer = setTimeout(() => goHome?.(), timeout);

            if (currentView === "video" && !menuJustClosed) {
                showKioskMenu();
                menuTimer = setTimeout(hideKioskMenu, MENU_TIMEOUT);
            }
        }

        // --- Eliminar todos los botones de historia ---
        function removeHistoriaButtons() {
            Array.from(document.getElementById("panel").getElementsByTagName("button"))
                .forEach(b => {
                    if (!b.classList.contains("backBtn")) b.remove();
                });
        }

        async function loadHistoriaMenuComponent() {
            const res = await fetch("components/historia-menu.html");
            return await res.text();
        }

        // --- HORARIOS ---
        function openHorarios() {
            removeHistoriaButtons();
            hideAllViews();
            document.getElementById("panel").style.display = "grid";
            slideshow.pause();
            loadHorariosHTML();
        }

        // --- CONTACTO ---
        function openContacto() {
            removeHistoriaButtons();
            hideAllViews();
            document.getElementById("panel").style.display = "block";
            slideshow.pause();
            loadContactHTML();
        }

        window.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) hideKioskMenu();
        });

        const tapHintTexts = ['Toca la pantalla', 'Touch the screen'];
        let tapHintIdx = 0;
        setInterval(() => {
            const hint = document.getElementById('tapHint');
            if (!hint || hint.classList.contains('hidden')) return;
            tapHintIdx = (tapHintIdx + 1) % tapHintTexts.length;
            hint.textContent = tapHintTexts[tapHintIdx];
        }, 5000);

        // --- Activities ---
        function openActividades() {
            removeHistoriaButtons();
            hideAllViews();

            document.getElementById("panel").style.display = "block";
            slideshow.pause();

            // 👇 Show container
            const container = document.getElementById("actividadesContainer");
            container.style.display = "block";
            container.innerHTML = "Cargando...";

            container.innerHTML = `
          <h1 class="text-6xl font-bold mb-12 text-center">
            Actividades y Eventos
          </h1>
        `;

            currentView = "actividades";

            loadActividadesHTML();
            container.classList.remove("hidden");
        }

        function toggleTheme() {
            const current = document.body.getAttribute("data-theme");
            const newTheme = current === "dark" ? "light" : "dark";

            document.body.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);

            updateThemeIcon(newTheme);
        }

        // Set correct theme icon 
        function updateThemeIcon(theme) {
            const btn = document.getElementById("themeIcon");
            if (!btn) return;

            btn.classList.add("rotating");

            setTimeout(() => {
                btn.textContent = theme === "dark" ? "☀️" : "🌙";
                btn.classList.remove("rotating");
            }, 150);
        }

        // Apply saved theme on load
        (function () {
            const savedTheme = localStorage.getItem("theme") || "dark";
            document.body.setAttribute("data-theme", savedTheme);

            // 👇 wait a bit because menu is loaded via fetch
            setTimeout(() => {
                updateThemeIcon(savedTheme);
            }, 100);
        })();
    </script>
    <script src="./js/languages.js"></script>
    <script src="./js/slideshow.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/historia.js"></script>
    <script src="./js/navigation.js"></script>
    <script src="./js/app.js"></script>
    <script>
        // currentView (navigation.js) must be defined before resetTimer() runs.
        resetTimer();
    </script>
</body>

</html>
